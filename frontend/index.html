<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slokabase</title>
    <script>
      // Applies the persisted/system theme before React mounts, so there's
      // no flash of the wrong theme on load. Mirrors store/themeStore.ts —
      // must stay in sync with its persist key name ("slokabase-theme") and
      // storage shape.
      (function () {
        try {
          var stored = localStorage.getItem('slokabase-theme');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          var isDark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
